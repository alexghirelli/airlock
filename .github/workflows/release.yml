name: release

# Push an annotated tag such as v0.1.0 to publish a release. The tag's message
# becomes the release notes, so write what changed for users:
#   git tag -a v0.1.0 -F notes.md   (a summary line, then the details)
# The release itself is named after the version only.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check
        run: go vet ./... && go test ./...
      - name: build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: release notes
        run: |
          # checkout can replace an annotated tag with a plain one; fetch the real object
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; create it with git tag -a and a message describing the release"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ "$(grep -c . notes.md)" -lt 2 ]; then
            echo "::error::the message of tag $GITHUB_REF_NAME needs a summary line and at least one line saying what changed"
            exit 1
          fi
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            cat notes.md
            printf '\n---\n\nInstall or upgrade: `curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh` (checksums in `SHA256SUMS`). After upgrading, run `airlock build`, then `airlock start --recreate` if the notes say the image or the sandbox settings changed.\n' "$GITHUB_REPOSITORY"
            if [ -n "$prev" ]; then
              printf '\nFull changelog: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            fi
          } > release.md
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release.md
