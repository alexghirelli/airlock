name: integration-slow

# The tests that download Claude Code (340 MB) and install npm packages. They take
# minutes and depend on the network, so they run weekly and on demand rather than
# on every push.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: slow integration tests
        env:
          AIRLOCK_IT_SLOW: '1'
        run: go test -tags integration -timeout 35m -run 'TestPackagesDefaultModelAndEnv' ./tests/...
