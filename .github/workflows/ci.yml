name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an older run on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fast checks only. The integration tests (real containers, a real image) live in
# integration.yml and run on demand and weekly.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: vet
        run: go vet ./... && go vet -tags integration ./tests/
      - name: unit tests
        run: go test ./...
      - name: cross-compile
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/airlock
          done
